version: "3.9"

services:
  # --------------------------------------------------
  # FastAPI Backend
  # --------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finco-backend-dev
    command: >
      uvicorn backend.app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./.env:/app/.env
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://finco:finco@postgres:5432/finco
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    networks:
      - finco-network

  # --------------------------------------------------
  # PostgreSQL
  # --------------------------------------------------
  postgres:
    image: postgres:16
    container_name: finco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finco
      POSTGRES_USER: finco
      POSTGRES_PASSWORD: finco
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finco -d finco"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finco-network

  # --------------------------------------------------
  # Redis
  # --------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: finco-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - finco-network

  # --------------------------------------------------
  # Qdrant (Vector Database)
  # --------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: finco-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - finco-network

  # --------------------------------------------------
  # Adminer (Database UI)
  # --------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: finco-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - finco-network

  # --------------------------------------------------
  # Prometheus (Optional Monitoring)
  # --------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: finco-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - finco-network

  # --------------------------------------------------
  # Grafana (Optional Dashboard)
  # --------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: finco-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - finco-network

# --------------------------------------------------
# Networks
# --------------------------------------------------
networks:
  finco-network:
    driver: bridge

# --------------------------------------------------
# Persistent Volumes
# --------------------------------------------------
volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  grafana_data: