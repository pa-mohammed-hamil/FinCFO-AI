global:
  resolve_timeout: 5m

  # SMTP configuration
  smtp_smarthost: "${SMTP_HOST}:${SMTP_PORT}"
  smtp_from: "${SMTP_FROM}"
  smtp_auth_username: "${SMTP_USERNAME}"
  smtp_auth_password: "${SMTP_PASSWORD}"
  smtp_require_tls: true

route:
  receiver: default-email
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - matchers:
        - severity="critical"
      receiver: critical-alerts
      continue: true

    - matchers:
        - severity="high"
      receiver: high-alerts

    - matchers:
        - service="fraud"
      receiver: fraud-team

    - matchers:
        - service="financial"
      receiver: finance-team

    - matchers:
        - service="backend"
      receiver: backend-team

receivers:
  - name: default-email
    email_configs:
      - to: "${DEFAULT_ALERT_EMAIL}"
        send_resolved: true

  - name: critical-alerts
    email_configs:
      - to: "${CFO_EMAIL}"
        send_resolved: true

    slack_configs:
      - api_url: "${SLACK_WEBHOOK}"
        channel: "#critical-alerts"
        title: "🚨 FinCo Critical Alert"
        text: |
          Alert: {{ .CommonLabels.alertname }}
          Severity: {{ .CommonLabels.severity }}
          Description: {{ .CommonAnnotations.description }}

    webhook_configs:
      - url: "http://backend:8000/api/alerts/webhook"
        send_resolved: true

  - name: high-alerts
    email_configs:
      - to: "${RISK_TEAM_EMAIL}"

  - name: fraud-team
    email_configs:
      - to: "${FRAUD_TEAM_EMAIL}"

  - name: finance-team
    email_configs:
      - to: "${FINANCE_TEAM_EMAIL}"

  - name: backend-team
    email_configs:
      - to: "${DEVOPS_EMAIL}"

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="high"
    equal:
      - alertname
      - service