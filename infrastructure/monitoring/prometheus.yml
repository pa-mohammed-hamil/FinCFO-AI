global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # ------------------------------
  # FastAPI Backend
  # ------------------------------
  - job_name: "finco-backend"
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000

  # ------------------------------
  # Nginx
  # ------------------------------
  - job_name: "nginx"
    static_configs:
      - targets:
          - nginx:9113

  # ------------------------------
  # PostgreSQL Exporter
  # ------------------------------
  - job_name: "postgres"
    static_configs:
      - targets:
          - postgres-exporter:9187

  # ------------------------------
  # Redis Exporter
  # ------------------------------
  - job_name: "redis"
    static_configs:
      - targets:
          - redis-exporter:9121

  # ------------------------------
  # Qdrant Metrics
  # ------------------------------
  - job_name: "qdrant"
    metrics_path: /metrics
    static_configs:
      - targets:
          - qdrant:6333

  # ------------------------------
  # Prometheus Self Monitoring
  # ------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets:
          - localhost:9090